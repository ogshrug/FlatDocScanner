name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # Ferrite (the "ferrite" engine) is a submodule built with the NDK.
          submodules: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Variants are channel (github / play) x engine (onnx / ferrite). One CPU type keeps
      # the APKs (and the run) small; arm64 also compiles Ferrite's NEON kernels.
      - name: Unit tests, lint and debug builds
        run: >
          sh ./gradlew
          :app:testGithubOnnxDebugUnitTest :app:testGithubFerriteDebugUnitTest :app:testPlayOnnxDebugUnitTest
          :app:lintGithubOnnxDebug :app:lintGithubFerriteDebug :app:lintPlayOnnxDebug
          :app:assembleGithubOnnxDebug :app:assembleGithubFerriteDebug :app:assemblePlayOnnxDebug :app:assemblePlayFerriteDebug
          -PtargetAbi=arm64-v8a --stacktrace

      - name: Keep the reports if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports
