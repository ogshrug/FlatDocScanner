name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # One CPU type keeps the debug APK (and the run) small; the Kotlin and resources
      # are the same for all of them.
      - name: Unit tests, lint and debug build
        run: sh ./gradlew :app:testGithubDebugUnitTest :app:testPlayDebugUnitTest :app:lintGithubDebug :app:lintPlayDebug :app:assembleGithubDebug :app:assemblePlayDebug -PtargetAbi=arm64-v8a --stacktrace

      - name: Keep the reports if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports
